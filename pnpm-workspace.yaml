packages:
  - packages/*
  - apps/*
  - benchmarks/*
  - tests
  - examples
  - scripts/typescript7
allowBuilds:
  esbuild: true
minimumReleaseAge: 1440
trustPolicy: no-downgrade
# The lockfile already holds these versions, and the policy stops any install
# that resolves them again. Exempt by exact version, so nothing new gets in.
trustPolicyExclude:
  - chokidar@4.0.3
  - semver@6.3.1
blockExoticSubdeps: true
# Angular's builder pins a newer Vite and rolldown than the repo's. Left alone,
# pnpm moves vitest, Nuxt and others onto its copies.
overrides:
  "@angular/build>rolldown": 1.2.12
  "@angular/build>vite": ^8.3.3

catalog:
  "@analogjs/vite-plugin-angular": 2.9.7
  "@angular/build": 22.3.0
  "@angular/common": 22.3.0
  "@angular/compiler": 22.3.0
  "@angular/compiler-cli": 22.3.0
  "@angular/core": 22.3.0
  "@angular/platform-browser": 22.3.0
  "@playwright/test": ^1.63.0
  "@solidjs/vite-plugin": 3.0.1
  "@solidjs/web": 2.0.0
  "@sveltejs/vite-plugin-svelte": ^7.3.1
  "@types/react": ~19.2.2
  "@types/react-dom": ~19.2.2
  "@vitejs/plugin-react": ^6.1.2
  "@vitejs/plugin-vue": ^6.0.9
  react: 19.2.3
  react-dom: 19.2.3
  rxjs: ^7.8.2
  solid-js: 2.0.0
  svelte: ^5.57.2
  svelte-check: ^4.7.6
  typescript: ~6.0.3
  # The native compiler, for plain type checks. `typescript` stays 6.0 for
  # tools that use its JavaScript API, like vue-tsc, svelte-check and ngc.
  typescript7: npm:typescript@7.0.2
  vite: ^8.3.3
  vue: ^3.5.43
  vue-tsc: ^3.3.12
